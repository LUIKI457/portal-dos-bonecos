<style>

.btn{background:var(--sun);padding:12px 20px;font-size:1.05rem}

#msg{min-height:1.3em;font-size:.95rem}

#logo{width:min(94vw,520px);height:auto}

</head>

function ell(c,x,y,rx,ry,fill,stroke){c.beginPath();c.ellipse(x,y,rx,ry,0,0,7);if(fill){c.fillStyle=fill;c.fill()}if(stroke)c.stroke()}

  c.fillStyle="#fff";for(var k=0;k<14;k++){var a=k*.45+time*3,r=36+p*90;c.beginPath();c.arc(x+Math.cos(a)*r,y-10+Math.sin(a*1.3)*r*.55,2.5+Math.sin(time*8+k),0,7);c.fill()}
  if(p>.45){c.globalAlpha=Math.min(1,(p-.45)*4);txt(d.nome,W/2,H*.2,Math.min(44,W/9));txt("Nível "+hero.lv+" · "+d.esp,W/2,H*.2+34,Math.min(20,W/20));c.globalAlpha=1}
}
function drawLogo(t){
  var cv=$("logo"),c=cv.getContext("2d"),w=cv.width,h=cv.height,cx=w/2,cy=h*.4;
  c.clearRect(0,0,w,h);
  [["#FFD34D",1,1],["#FF6BA8",.84,-1.3],["#8EE0FF",.68,1.6]].forEach(function(r){c.save();c.translate(cx,cy);c.rotate(t*.35*r[2]);c.strokeStyle=r[0];c.lineWidth=9;c.setLineDash([44,22]);c.beginPath();c.ellipse(0,0,w*.47*r[1],h*.34*r[1],0,0,7);c.stroke();c.restore()});
  c.setLineDash([]);c.lineJoin="round";c.textAlign="center";
  c.font="700 "+Math.round(w*.16)+"px Fredoka,system-ui,sans-serif";
  c.lineWidth=16;c.strokeStyle=INK;c.fillStyle=INK;c.strokeText("PORTAL",cx+4,cy+6);c.fillText("PORTAL",cx+4,cy+6);
  var gr=c.createLinearGradient(0,cy-50,0,cy+6);gr.addColorStop(0,"#FFF07A");gr.addColorStop(1,"#FF9A3D");
  c.strokeText("PORTAL",cx,cy);c.fillStyle=gr;c.fillText("PORTAL",cx,cy);
  c.font="700 "+Math.round(w*.08)+"px Fredoka,system-ui,sans-serif";c.lineWidth=10;c.strokeStyle=INK;c.strokeText("DOS BONECOS",cx,cy+w*.09);c.fillStyle="#fff";c.fillText("DOS BONECOS",cx,cy+w*.09);
  var k=0;HEROES.forEach(function(d,i){if(d.estado==="inicial"&&k<3){drawHero(c,i,w*(.24+.26*k),h-32,.9,t+k,0,1,0,false);k++}});
}
function porLink(){
  var q=new URLSearchParams(location.search),b=q.get("boneco"),k=q.get("chave"),c=q.get("criador");
  if(c!==null){if(c===SEGREDOS.criador){save.criador=1;gravar();menuBuild();msg("Criador de personagens liberado neste aparelho!")}else msg("Código do criador inválido.")}
  if(b){
    var i=idxDe(b);
    if(i<0){msg("Boneco não reconhecido.");return}
    var d=HEROES[i];
    if(d.estado==="secreto"&&k===d.chave&&!save.lib[d.id]){save.lib[d.id]=1;gravar()}
    if((d.estado==="progressao"||d.estado==="link")&&!save.lib[d.id]){save.lib[d.id]=1;gravar()}
    if(disponivel(i))start(i);else msg(d.estado==="futuro"?"Este boneco ainda não foi lançado.":(d.estado==="link"?"Libera com a tag NFC.":d.estado==="progressao"?"Desbloqueia ao chegar na fase "+d.req+".":"Este boneco secreto precisa da tag original."));
  }
}
carregarImgs();menuBuild();setScr("menu");porLink();
